[package]
name = "tern-app"
description = "Tern desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tern"
path = "src/main.rs"

[dependencies]
tern-core.workspace = true
gpui-kit.workspace = true
alacritty_terminal = "0.26"
# Decoding inline images; GPUI already builds these formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
# Inline images, as tests send them.
base64 = "0.22"
tern-core = { workspace = true, features = ["test-support"] }
# Headless UI tests use GPUI's own test support, from the exact GPUI build
# gpui-kit pins. (gpui-kit's `test-support` also pulls the separate GPUI Fast
# stack, whose version pins conflict with this one.) Named `gpui` because
# GPUI's test macro expands to `gpui::` paths.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
