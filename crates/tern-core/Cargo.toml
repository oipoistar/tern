[package]
name = "tern-core"
description = "Tern's UI-free core: hosts, vault, SSH and sync"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
# Encrypting what sync writes: Argon2id for the key, XChaCha20-Poly1305 for the data.
argon2 = "0.6"
# Inline images' data, and known_hosts' hashed names.
base64 = "0.22"
chacha20poly1305 = "0.11"
# Matching known_hosts' hashed names (the versions russh uses).
hmac = "0.13"
# The system's credential store, for the sync passphrase and saved passwords.
keyring = "4"
# Local terminals: the shell on a pseudo-terminal.
portable-pty = "0.9"
# Generating keys.
rand = { version = "0.10", features = ["thread_rng"] }
# `ring` instead of the default aws-lc backend: it builds with only the
# platform C toolchain (no CMake/NASM on Windows).
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "fs"] }

[features]
# Sample hosts for other crates' tests (`Vault::sample`).
test-support = []

[dev-dependencies]
russh-sftp = "3"
# Its SFTP server, for the end-to-end tests.
tern-devserver = { path = "../tern-devserver" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

# Reading PuTTY's saved sessions, which live in the registry on Windows,
# and reaching Pageant for agent forwarding.
[target.'cfg(windows)'.dependencies]
pageant = "0.2"
windows-registry = "0.6"
