[package]
name = "tern-core"
description = "Tern's UI-free core: hosts, vault, SSH and sync"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
# Generating keys.
rand = { version = "0.10", features = ["thread_rng"] }
# `ring` instead of the default aws-lc backend: it builds with only the
# platform C toolchain (no CMake/NASM on Windows).
russh ={ version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }

[features]
# Sample hosts for other crates' tests (`Vault::sample`).
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

# Reading PuTTY's saved sessions, which live in the registry on Windows.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
