# The checks AGENTS.md asks for before every commit, on Windows, macOS and
# Linux: formatting, warning-free clippy, and the tests (headless UI tests
# and the end-to-end SSH tests included).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run in progress finishes; of the pushes made meanwhile, only the newest
# waits to run next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # GPUI links X11, xcb, xkbcommon, Wayland and fontconfig on Linux.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev libvulkan1

      - uses: Swatinem/rust-cache@v2

      # Formatting doesn't differ by platform; once is enough.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
