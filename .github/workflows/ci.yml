# The checks AGENTS.md asks for before every commit: formatting,
# warning-free clippy, and the tests (headless UI tests and the end-to-end
# SSH tests included). Windows runs on the project's own machine, a
# self-hosted runner (see DEVELOPMENT.md); macOS and Linux are paused for
# now.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run in progress finishes; of the pushes made meanwhile, only the newest
# waits to run next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Checks only read the repository.
permissions:
  contents: read

# Steps run in bash everywhere: on Windows that's Git's, which needs neither
# PowerShell 7 nor an execution policy that lets scripts run, as the
# self-hosted runner's machine has neither.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runs-on: [self-hosted, Windows, X64]
          # Paused for now; bring them back to run there too.
          # - name: macos
          #   runs-on: macos-latest
          # - name: ubuntu
          #   runs-on: ubuntu-latest
    # Pull requests from forks run on GitHub's own machines, never on the
    # self-hosted runner, which runs whatever a workflow says.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'windows-latest' || matrix.runs-on }}
    timeout-minutes: 60
    # Actions run on the project's own machine, so each is pinned to the
    # commit its tag named when last checked: a tag moved later (or a
    # branch, as rust-toolchain's `stable`) can't change what runs there.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rustup now and then aborts here, making the TLS connection to sync
      # the channel (exception 0xc0000409, which Git's bash reports as 127;
      # about 1 run in 30 on the project's machine). The step goes once
      # more when it did.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        continue-on-error: true
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.toolchain.outcome == 'failure'
        with:
          toolchain: stable
          components: clippy, rustfmt

      # GPUI links X11, xcb, xkbcommon, Wayland and fontconfig on Linux.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev libvulkan1

      # A self-hosted runner keeps its build output from run to run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment == 'github-hosted'

      # Formatting doesn't differ by platform; once is enough.
      - name: Formatting
        if: runner.os == 'Windows'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Every suite runs, so one run shows every failure.
        run: cargo test --workspace --no-fail-fast
