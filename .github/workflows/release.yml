# Publishes a GitHub Release for a version tag (v0.1.0, …): Tern for
# Windows as one file, Tern-windows-x64.exe, which the README's download
# link points at. macOS and Linux builds come later (ROADMAP item 20).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Git's bash, as in CI (see ci.yml).
defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows
    # The project's own machine, as CI's Windows checks (see DEVELOPMENT.md).
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    # Pinned to commits, as in ci.yml: what runs on the project's machine,
    # with a token that can publish, doesn't change by itself.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The exe carries Cargo.toml's version; a tag that says otherwise is
      # a mistake.
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      # rustup now and then aborts while it syncs the channel; once more
      # when it did, as in ci.yml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        continue-on-error: true
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.toolchain.outcome == 'failure'
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment == 'github-hosted'

      - name: Build
        run: cargo build -p tern-app --release --locked

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${CARGO_TARGET_DIR:-target}/release/tern.exe" Tern-windows-x64.exe
          gh release create "$GITHUB_REF_NAME" Tern-windows-x64.exe \
            --title "Tern ${GITHUB_REF_NAME#v}" \
            --notes "Download **Tern-windows-x64.exe** below and run it: one file, nothing to install. The first time, Windows may say it protected your PC, as Tern isn't signed yet: choose **More info**, then **Run anyway**." \
            --generate-notes
